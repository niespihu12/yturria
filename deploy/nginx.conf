server {
    listen 80;
    listen [::]:80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Subida de documentos a la base de conocimiento.
    client_max_body_size 20m;

    location = /health {
        default_type text/plain;
        return 200 "ok";
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Se sobrescribe (no se concatena) para que el cliente no pueda falsificar su IP.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }

    # La ruta /embed se carga en iframes de los sitios de los clientes, por eso
    # no se envía X-Frame-Options.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy strict-origin-when-cross-origin;
        try_files $uri $uri/ /index.html;
    }
}
