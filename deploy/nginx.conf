# Con docker-compose.https.yml, Caddy (red interna de Docker) termina TLS delante de
# nginx: solo a él se le creen X-Forwarded-For y X-Forwarded-Proto.
geo $realip_remote_addr $from_proxy {
    default 0;
    10.0.0.0/8 1;
    172.16.0.0/12 1;
    192.168.0.0/16 1;
}

map "$from_proxy:$http_x_forwarded_proto" $forwarded_proto {
    default $scheme;
    "1:https" https;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;

    # DNS de Docker con caché corta: si el backend se recrea y cambia de IP, nginx la sigue.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Subida de documentos a la base de conocimiento.
    client_max_body_size 20m;

    location = /health {
        default_type text/plain;
        return 200 "ok";
    }

    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Se sobrescribe (no se concatena) para que el cliente no pueda falsificar su IP;
        # $remote_addr ya es la IP real cuando la petición viene de Caddy.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 120s;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }

    # La ruta /embed se carga en iframes de los sitios de los clientes, por eso
    # no se envía X-Frame-Options.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy strict-origin-when-cross-origin;
        try_files $uri $uri/ /index.html;
    }
}
