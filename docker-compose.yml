# Despliegue: ver la sección "Despliegue con Docker" de backend/README.md.
# Variables de la base de datos (MYSQL_*) se leen del entorno o de un .env en la
# raíz del repo; el resto de la configuración del backend vive en backend/.env.
# MYSQL_PASSWORD va dentro de DATABASE_URL: solo letras y números (sin "@" ni "%").
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-omnicanal}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - internal

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    env_file:
      - path: backend/.env
        required: true
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-app}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE:-omnicanal}
      # Solo nginx (red interna) llega al backend; confía en su X-Forwarded-For.
      FORWARDED_ALLOW_IPS: "*"
    depends_on:
      db:
        condition: service_healthy
    # Publicado solo en localhost para diagnóstico; el tráfico público entra por nginx (/api).
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - internal
      - public

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_BRAND: ${VITE_BRAND:-}
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - public

  backup:
    image: mysql:8.4
    restart: "no"
    profiles: ["backup"]
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-app}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE:-omnicanal}
      BACKUP_ENCRYPT_PASSPHRASE: ${BACKUP_ENCRYPT_PASSPHRASE:-}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      GCS_BUCKET: ${GCS_BUCKET:-}
      RETAIN_DAYS: ${RETAIN_DAYS:-7}
    volumes:
      - ./backend/scripts/backup_db.sh:/backup_db.sh:ro
      - backup_data:/var/backups/db
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/backup_db.sh"]
    networks:
      - internal

volumes:
  db_data:
  backup_data:

networks:
  internal:
  public:
