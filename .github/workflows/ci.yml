name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Run tests
        working-directory: backend
        env:
          # Las claves de prueba son mínimas — no son producción.
          # El startup check se omite porque SKIP_STARTUP_CHECK=true.
          SKIP_STARTUP_CHECK: "true"
          DATABASE_URL: "sqlite://"
          JWT_SECRET: "ci-test-secret-key-not-used-in-production-padding"
          OPENAI_API_KEY: ""
          ELEVENLABS_API_KEY: ""
          MAIL_PASSWORD: ""
        run: uv run pytest tests/ -q --tb=short

  frontend-quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: ESLint
        working-directory: frontend
        run: npx eslint . --max-warnings 0

      # tsc -b + vite build: el tsconfig raíz es de tipo "solución", así que
      # `tsc --noEmit` no comprobaba ningún archivo.
      - name: Type check + production build
        working-directory: frontend
        env:
          VITE_API_URL: /api
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install uv && uv sync --frozen

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium

      # Backend real + SQLite desechable + claves externas vacías (e2e/start-backend.mjs).
      - name: Playwright
        working-directory: frontend
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f Dockerfile.backend -t yturria-backend:ci .

      - name: Build frontend image
        run: docker build -f Dockerfile.frontend -t yturria-frontend:ci .

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect hardcoded secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}  # opcional para repos privados
